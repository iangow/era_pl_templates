# Tables that are not WRDS downloads. They are built by other code and must
# already be in DATA_DIR/<schema>/.
[other]
glms = "Pre-generated files for the application section of glms.qmd (see the note at the top of that template)."

# chapter = tables it loads with load_parquet(). An empty list means the
# chapter runs with no local Parquet data.
[chapters]
"py-intro" = []
"reg-basics" = []
"causal-inf" = []
"stat-inf" = []
"fin-state" = ["comp.company", "comp.funda", "comp.fundq"]
identifiers = ["comp.funda", "comp.fundq", "crsp.ccmxpf_lnkhist", "crsp.dsf", "crsp.dsi", "crsp.msf", "crsp.msi", "crsp.stocknames"]
"fin-state-reprise" = ["comp.company", "comp.funda"]
"web-data" = []
ffjr = ["crsp.dsedist", "crsp.msf", "crsp.msi", "crsp.stocknames"]
bb68 = ["comp.funda", "comp.fundq", "crsp.ccmxpf_lnkhist", "crsp.msf", "crsp.msi", "crsp.stocknames"]
beaver68 = ["comp.fundq", "crsp.ccmxpf_lnkhist", "crsp.dsf", "crsp.dsi", "crsp.stocknames"]
"event-studies" = ["comp.idx_daily", "crsp.dsf", "crsp.dsi", "crsp.stocknames"]
pead = ["comp.company", "comp.funda", "comp.fundq", "crsp.ccmxpf_lnkhist", "crsp.dsedelist", "crsp.dsf", "crsp.erdport1"]
accruals = ["comp.company", "comp.funda", "crsp.ccmxpf_lnkhist", "crsp.msf"]
"earnings-mgt" = ["comp.company", "comp.funda"]
natural = []
mechanisms = []
"natural-revisited" = ["comp.funda", "crsp.ccmxpf_lnkhist", "crsp.dseexchdates", "crsp.dsf", "crsp.mse", "crsp.msf", "crsp.stocknames"]
iv = []
"panel-data" = ["comp.funda", "compseg.names_seg", "compseg.seg_customer"]
rdd = ["comp.funda", "crsp.ccmxpf_lnkhist", "crsp.dsf", "ff.factors_daily"]
glms = ["glms.compustat", "glms.event_dates", "glms.filing_10k_merged", "glms.liquidity", "glms.lm_10x_summary", "glms.trading_dates", "glms.vdis_df"]
