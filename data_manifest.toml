# Data each template reads from DATA_DIR.
#
# `scripts/download_wrds_tables.py` reads this file. The `[chapters]` lists are
# the tables a template names in `load_parquet(...)` calls. Regenerate them
# with `uv run scripts/download_wrds_tables.py --scan` after editing a template.
# Tables under `[wrds]` that no chapter lists are read inside `era_pl` helpers.

# Tables downloaded from WRDS with db2pq, in download order.
# `kwargs` are passed to `db2pq.wrds_update_pq`.

[[wrds]]
schema = "crsp"
table = "ccmxpf_lnkhist"
kwargs = { col_types = { lpermno = "int32", lpermco = "int32" } }

[[wrds]]
schema = "crsp"
table = "stocknames"

[[wrds]]
schema = "crsp"
table = "dsi"

[[wrds]]
schema = "crsp"
table = "comphist"

[[wrds]]
schema = "crsp"
table = "dsedelist"

[[wrds]]
schema = "crsp"
table = "dseexchdates"

[[wrds]]
schema = "crsp"
table = "dsedist"

[[wrds]]
schema = "crsp"
table = "msi"

[[wrds]]
schema = "crsp"
table = "mse"

[[wrds]]
schema = "crsp"
table = "msf"

[[wrds]]
schema = "crsp"
table = "erdport1"

[[wrds]]
schema = "crsp"
table = "dsf"

[[wrds]]
schema = "ff"
table = "factors_daily"

[[wrds]]
