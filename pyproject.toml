requires-python = ">=3.11,<3.14"
dependencies = [
    "causalml>=0.15.5",
    "db2pq>=0.2.2",
    "era-py[polars,tables]>=0.0.19",
    "gdown",
    "great-tables",
    "imbalanced-learn>=0.14.1",
    "ipykernel",
    "ipython",
    "jupyter",
    "jupyter-cache",
    "linearmodels",
    "maketables>=0.1.8",
    "matplotlib",
    "numpy",
    "pandas",
    "pdfplumber",
    "plotnine",
    "polars",
    "pyfixest>=0.40.1",
    "python-dotenv",
    "quarto",
    "rdrobust>=1.3.0",
    "requests",
    "scikit-learn>=1.8.0",
    "scipy",
    "seaborn",
    "statsmodels",
