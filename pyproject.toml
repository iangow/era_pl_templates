[project]
name = "era-pl-templates"
version = "0.1.5"
description = "Runnable Quarto templates for Empirical Research in Accounting"
requires-python = ">=3.11,<3.14"
dependencies = [
    "altair>=6.0.0",
    "db2pq>=0.3.0",
    "era-py[polars,tables]==0.0.37",
    "great-tables",
    "imbalanced-learn>=0.14.1",
    "ipykernel",
    "jupyter",
    "jupyter-cache",
    "linearmodels>=7.1",
    "llvmlite>=0.42",
    "maketables>=0.2.0",
    "matplotlib",
    "numba>=0.59",
    "numpy",
    "pandas",
    "pdfplumber",
    "plotnine>=0.15.9",
    "plotnine-polars>=0.2.1",
    "polars[excel]>=2.1.0",
    "pyfixest>=0.40.1",
    "python-dotenv",
    "quarto",
    "rdrobust>=1.3.0",
    "requests",
    "scikit-learn>=1.8.0",
    "scipy",
    "seaborn",
    "statspai==1.46.3",
    "statsmodels",
]

[tool.uv]
# Desktop Quarto environments; plotnine has incompatible Pyodide-only constraints.
environments = ["sys_platform != 'emscripten'"]
